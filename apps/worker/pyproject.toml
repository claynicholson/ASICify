[project]
name = "asicify-worker"
version = "0.1.0"
description = "ASICify worker. Compression pipeline, RTL generation, hardware estimation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core compiler. Minimal install.
    "torch>=2.5.0",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# Hosted-stack workers and the HF-model loader live here.
hosted = [
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.5",
    "redis>=5.1.1",
    "boto3>=1.35.0",
    "httpx>=0.27.2",
    "modal>=0.66.0",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # RTL simulation: the generated package's `make sim` target drives
    # Verilator through cocotb. Pinned <2.0 (2.x changed the Makefile flow).
    "cocotb>=1.9,<2.0",
]

[tool.pytest.ini_options]
markers = [
    "sim: runs the generated RTL through Verilator via cocotb (needs verilator + make on PATH)",
]

[project.scripts]
asicify = "worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
