[project]
name = "asicify-worker"
version = "0.1.0"
description = "ASICify worker — compression pipeline, RTL generation, hardware estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "safetensors>=0.4.5",
    "bitsandbytes>=0.44.0; platform_system != 'Darwin'",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "redis>=5.1.1",
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "modal>=0.66.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "cocotb>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
