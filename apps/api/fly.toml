# Fly.io app config for the ASICify FastAPI backend.
#
# Deploy:
#   cd apps/api
#   fly launch --no-deploy   (first time only; pick a region)
#   fly secrets set DATABASE_URL=... REDIS_URL=... R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=...
#   fly deploy

app = "asicify-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
